# Blueprint de Render para la API (ver DESPLIEGUE.md).
# El sitio (web/) se publica en Cloudflare Pages y reenvía /api/* aquí.
# La base de datos vive en Supabase (ver SUPABASE.md): Render solo corre la API.
services:
  - type: web
    name: punto-neutro-api
    runtime: node
    plan: free
    region: oregon
    # --prod=false: el build necesita prisma, typescript y tsx (devDependencies).
    # El seed solo carga contenido la primera vez (base vacía).
    buildCommand: npx pnpm@10.28.0 install --frozen-lockfile --prod=false && npx pnpm@10.28.0 --filter server build && npx pnpm@10.28.0 --filter server db:deploy && npx pnpm@10.28.0 --filter server db:seed
    startCommand: cd server && node dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: NODE_ENV
        value: production
      # Supabase · pooler en modo transacción (puerto 6543): lo usa la API.
      - key: DATABASE_URL
        sync: false
      # Supabase · pooler en modo sesión (puerto 5432): lo usan las migraciones del build.
      - key: DIRECT_URL
        sync: false
      # Certificado de Supabase (PEM) para verificar la conexión SSL.
      - key: DATABASE_SSL_CA
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: TRUST_PROXY
        value: "2"
      - key: PROXY_SECRET
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
