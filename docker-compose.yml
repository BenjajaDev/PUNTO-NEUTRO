# Postgres para desarrollo local: `docker compose up -d`
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: puntoneutro
      POSTGRES_PASSWORD: puntoneutro
      POSTGRES_DB: puntoneutro
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
